[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleet-contracts"
version = "0.1.0"
description = "Fleet Agent IDE Contracts and Schemas"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
