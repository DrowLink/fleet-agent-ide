[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleet-backend"
version = "0.1.0"
description = "Fleet Agent IDE Backend Daemon and Worktree Orchestration Engine"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.20",
    "gitpython>=3.1.43",
    "pydantic>=2.8.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "sse-starlette>=2.1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_backend"]
